<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <title>products</title>
  </head>
  <body>
    <main class="main">
      <div class="container">
        <h1 class="title">Выбери свой продукт</h1>
        <div class="button-layout">
          <button class="button-settings" id="card-color-change-button">поменять цвет одной карточки</button>
          <button class="button-settings" id="cards-color-change-button">поменять цвет всех карточек</button>
          <button class="button-settings" id="open-google-button">открыть <span>g</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></button>
          <button class="button-settings" id="console-output-button">вывести сообщение в консоль log</button>
          <button class="button-settings" id="change-button-color-button">нажми что-бы поменять цвет этой кнопки</button>
        </div>
        <div id="productCardList">
          <template id="productCard-template">
            <div class="products__item card card_color-backviolet">
              <img
                class="card__image"
                src=""
                alt=""/>
              <div class="card__description-block">
                <span class="card__category"></span>
                <h2 class="card__name"></h2>
                <p class="mainText"></p>
              </div>
              <div class="card__compaund compaund">
                <span>Состав:</span>
                <ul class="compaund__components">
                  <li class="firstComponent"></li>
                  <li class="secondComponent"></li>
                  <li class="thirdComponent"></li>
                </ul>
              </div>
              <div class="card__price">
                <b class="card__price-value">Цена</b>
                <span class="card__price-sum"></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
    <script src="homework-7.js" defer></script>
    <script src="homework-8.js" defer></script>
    <script src="homework-9.js" defer type="module"></script>
    <script src="homework-10.js" defer type="module"></script>
  </body>
</html>
